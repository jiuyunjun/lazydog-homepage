# Deploy Firebase Hosting when main is pushed.
name: Deploy to Firebase Hosting on push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/818124276251/locations/global/workloadIdentityPools/github-actions/providers/lazydog-homepage
          service_account: github-actions-deploy@lazydog-homepage.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g firebase-tools

      # Rewrites ?v=__V__ to this commit so the immutable cache headers in
      # firebase.json are safe on filenames that are never content-hashed.
      # firebase.json's predeploy hook re-checks this and fails the deploy if
      # any token survived.
      - run: ASSET_VERSION="${GITHUB_SHA::8}" node scripts/stamp-assets.mjs

      - run: firebase deploy --only hosting --project lazydog-homepage
